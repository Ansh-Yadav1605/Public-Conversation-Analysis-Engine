[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "conversation-analysis-engine"
version = "0.1.0"
description = "Public Conversation Analysis Engine — Graduation Project (Product Management)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "app-store-scraper>=0.3.5",
    "google-play-scraper>=1.2.4",
    "praw>=7.7.1",
    "google-api-python-client>=2.116.0",
    "tweepy>=4.14.0",
    "langdetect>=1.0.9",
    "nltk>=3.8.1",
    "regex>=2023.12.25",
    "sentence-transformers>=2.3.1",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.4",
    "jsonlines>=4.0.0",
    "colorlog>=6.8.2",
    "tqdm>=4.66.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]

[project.scripts]
run-pipeline = "engine.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["engine"]
omit = ["tests/*", "engine/config/*"]
